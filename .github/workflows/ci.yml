name: CI & SDK Release Pipeline

on:
  push:
    branches: [ main, read-celestrak-columns, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Generate Local Dev RSA Keys
        run: ./scripts/setup-keys.sh

      - name: Run Test Suite
        run: cargo test --all-targets --all-features

      - name: Build Release Binary
        run: cargo build --release

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: astrea-sda-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  openapi-breaking-change-check:
    name: OpenAPI Breaking Change Gate (pb33f/openapi-changes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Head Branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          path: base

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Install pb33f/openapi-changes CLI
        run: go install github.com/pb33f/openapi-changes@latest

      - name: Detect OpenAPI Contract Breaking Changes
        run: |
          echo "Comparing base OpenAPI spec against head OpenAPI spec..."
          if [ -f base/api-docs/openapi.json ] && [ -f head/api-docs/openapi.json ]; then
            $(go env GOPATH)/bin/openapi-changes summary --markdown base/api-docs/openapi.json head/api-docs/openapi.json
          else
            echo "Notice: Base or Head OpenAPI spec file missing (initial setup or non-PR event). Skipping diff."
          fi

  fern-sdk-build-and-release:
    name: Fern SDK Generation & Release Build
    runs-on: ubuntu-latest
    needs:
      - test-and-build
      - docker-build-check
      - openapi-breaking-change-check
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Fern CLI
        run: npm install -g fern-api

      - name: Run Fern Spec Check
        run: fern check --warnings

      - name: Analyze Conventional Commits & Version Bump
        id: analyze_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          custom_release_rules: 'fix:patch,chore:patch:Maintenance,docs:patch:Documentation,refactor:patch,perf:patch,style:patch,build:patch,ci:patch,test:patch,feat:minor'
          parse_squash_commits: true
          release_branches: 'main'
          dry_run: true

      - name: Guard Against Breaking Changes Gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          RELEASE_TYPE="${{ steps.analyze_version.outputs.release_type }}"
          echo "Detected conventional commit release type: $RELEASE_TYPE"
          
          # Check 1: Release type computed by conventional commit analyzer
          if [ "$RELEASE_TYPE" = "major" ]; then
            echo "::error title=Breaking Change Blocked::A breaking change (major bump) was detected in conventional commits on main! Automated SDK releases block breaking changes to protect client stability. Release aborted."
            exit 1
          fi

          # Check 2: Direct scan of commit messages since previous tag for breaking indicators
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMIT_LOG=$(git log ${PREV_TAG}..HEAD --format="%s%n%b")
          else
            COMMIT_LOG=$(git log -n 10 --format="%s%n%b")
          fi

          if echo "$COMMIT_LOG" | grep -E -q '(^[a-zA-Z]+(\([^\)]+\))?!:|^BREAKING CHANGE:|^BREAKING-CHANGE:)'; then
            echo "::error title=Breaking Change Blocked::Commit message contains breaking change indicator (!: or BREAKING CHANGE:)! Automated SDK releases block breaking changes on main. Release aborted."
            exit 1
          fi

          echo "Conventional commit verification passed: Release type is non-breaking ($RELEASE_TYPE)."

      - name: Determine Version Bump & Create Tag
        id: bump_tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          custom_release_rules: 'fix:patch,chore:patch:Maintenance,docs:patch:Documentation,refactor:patch,perf:patch,style:patch,build:patch,ci:patch,test:patch,feat:minor'
          parse_squash_commits: true
          release_branches: 'main'

      - name: Generate SDKs with Fern (Open-Source Local CLI)
        run: |
          SDK_VERSION="${{ steps.bump_tag.outputs.new_version }}"
          if [ -z "$SDK_VERSION" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            SDK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$SDK_VERSION" ]; then
            echo "Generating Fern SDKs for version ${SDK_VERSION}..."
            fern generate --local --version "${SDK_VERSION}"
          else
            echo "Generating Fern SDKs with default versioning..."
            fern generate --local
          fi

      - name: Package SDK Archives
        run: |
          mkdir -p dist
          tar -czvf dist/astrea-sda-api-sdk-typescript.tar.gz -C sdks/typescript .
          tar -czvf dist/astrea-sda-api-sdk-python.tar.gz -C sdks/python .
          tar -czvf dist/astrea-sda-api-sdk-go.tar.gz -C sdks/go .
          tar -czvf dist/astrea-sda-api-sdk-java.tar.gz -C sdks/java .
          tar -czvf dist/astrea-sda-api-sdk-rust.tar.gz -C sdks/rust .

      - name: Release SDK Archives to GitHub Releases
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bump_tag.outputs.new_tag != '') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_tag.outputs.new_tag || github.ref_name }}
          name: ${{ steps.bump_tag.outputs.new_tag || github.ref_name }}
          body: ${{ steps.bump_tag.outputs.changelog }}
          files: |
            dist/astrea-sda-api-sdk-typescript.tar.gz
            dist/astrea-sda-api-sdk-python.tar.gz
            dist/astrea-sda-api-sdk-go.tar.gz
            dist/astrea-sda-api-sdk-java.tar.gz
            dist/astrea-sda-api-sdk-rust.tar.gz
          generate_release_notes: ${{ steps.bump_tag.outputs.changelog == '' }}

  deploy-railway:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    needs:
      - test-and-build
      - docker-build-check
      - openapi-breaking-change-check
      - fern-sdk-build-and-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Railway Secret Token
        id: check-token
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::notice::RAILWAY_TOKEN secret is not configured in repository secrets. Skipping deployment."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Railway CLI
        if: steps.check-token.outputs.has_token == 'true'
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        if: steps.check-token.outputs.has_token == 'true'
        run: railway up --service astrea-sda-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-github-pages:
    name: Deploy OpenAPI Docs to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - test-and-build
      - openapi-breaking-change-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload OAS Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'api-docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


