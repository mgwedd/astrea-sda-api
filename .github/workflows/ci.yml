name: CI & SDK Release Pipeline

on:
  push:
    branches: [ main, read-celestrak-columns, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release semver bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Optional explicit version (e.g. 2.0.0). Overrides bump calculation.'
        required: false
        type: string
      confirm_breaking:
        description: 'REQUIRED for MAJOR releases: I confirm this is an intentional breaking change'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Generate Local Dev RSA Keys
        run: ./scripts/setup-keys.sh

      - name: Run Test Suite
        run: cargo test --all-targets --all-features

      - name: Build Release Binary
        run: cargo build --release

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: astrea-sda-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  openapi-breaking-change-check:
    name: OpenAPI Breaking Change Gate (pb33f/openapi-changes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Head Branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          path: base

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Install pb33f/openapi-changes CLI
        run: go install github.com/pb33f/openapi-changes@latest

      - name: Detect OpenAPI Contract Breaking Changes
        run: |
          echo "Comparing base OpenAPI spec against head OpenAPI spec..."
          if [ -f base/api-docs/openapi.json ] && [ -f head/api-docs/openapi.json ]; then
            $(go env GOPATH)/bin/openapi-changes summary --markdown base/api-docs/openapi.json head/api-docs/openapi.json
          else
            echo "Notice: Base or Head OpenAPI spec file missing (initial setup or non-PR event). Skipping diff."
          fi

  fern-sdk-build-and-release:
    name: Fern SDK Generation & Release Build
    runs-on: ubuntu-latest
    needs:
      - test-and-build
      - docker-build-check
      - openapi-breaking-change-check
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Fern CLI
        run: npm install -g fern-api

      - name: Run Fern Spec Check
        run: fern check --warnings

      - name: Analyze Conventional Commits & Version Bump
        id: analyze_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          custom_release_rules: 'fix:patch,chore:patch:Maintenance,docs:patch:Documentation,refactor:patch,perf:patch,style:patch,build:patch,ci:patch,test:patch,feat:minor'
          parse_squash_commits: true
          release_branches: 'main'
          dry_run: true

      - name: Breaking Change & Scope Gate
        id: breaking_guard
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          # 1. Manual workflow_dispatch handling
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DISPATCH_TYPE="${{ github.event.inputs.release_type }}"
            CONFIRM_BREAKING="${{ github.event.inputs.confirm_breaking }}"
            echo "Manual release dispatch triggered: type=$DISPATCH_TYPE, confirm_breaking=$CONFIRM_BREAKING"
            
            if [ "$DISPATCH_TYPE" = "major" ] && [ "$CONFIRM_BREAKING" != "true" ]; then
              echo "::error title=Major Release Consent Required::Major version upgrade requires explicit consent! Check 'confirm_breaking' in workflow inputs to authorize breaking changes."
              exit 1
            fi
            echo "skip_sdk_build=false" >> $GITHUB_OUTPUT
            echo "release_type=$DISPATCH_TYPE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. Automated push to main handling
          RELEASE_TYPE="${{ steps.analyze_version.outputs.release_type }}"
          echo "Detected conventional commit release type: $RELEASE_TYPE"
          
          # Check for breaking indicators in conventional commits
          if [ "$RELEASE_TYPE" = "major" ]; then
            echo "::error title=Breaking Change Blocked::A breaking change (major bump) was detected in conventional commits on main! Automated SDK releases block breaking changes to protect client stability. To perform an intentional major version upgrade, use workflow_dispatch with explicit confirmation, or push an explicit tag."
            exit 1
          fi

          # Scan commit messages since previous tag for breaking indicators
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMIT_LOG=$(git log ${PREV_TAG}..HEAD --format="%s%n%b")
          else
            COMMIT_LOG=$(git log -n 10 --format="%s%n%b")
          fi

          if echo "$COMMIT_LOG" | grep -E -q '(^[a-zA-Z]+(\([^\)]+\))?!:|^BREAKING CHANGE:|^BREAKING-CHANGE:)'; then
            echo "::error title=Breaking Change Blocked::Commit message contains breaking change indicator (!: or BREAKING CHANGE:)! Automated SDK releases block breaking changes on main. Release aborted."
            exit 1
          fi

          # 3. Check if changes are solely chore or docs (no SDK build needed for chore/docs)
          SUBJECTS=$(if [ -n "$PREV_TAG" ]; then git log ${PREV_TAG}..HEAD --format="%s"; else git log -n 5 --format="%s"; fi)
          NON_CHORE_DOCS=$(echo "$SUBJECTS" | grep -v -E '^(chore|docs)(\([^\)]+\))?:' | grep -v '^$' || true)
          if [ -z "$NON_CHORE_DOCS" ] && [ -n "$SUBJECTS" ]; then
            echo "Release consists solely of chore/docs commits ($RELEASE_TYPE). Version tag will be created, but Fern SDK compilation will be skipped."
            echo "skip_sdk_build=true" >> $GITHUB_OUTPUT
          else
            echo "Release contains functional changes ($RELEASE_TYPE). Full Fern SDK build will execute."
            echo "skip_sdk_build=false" >> $GITHUB_OUTPUT
          fi

          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT

      - name: Determine Version Bump & Create Tag (Auto Push)
        id: bump_tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          custom_release_rules: 'fix:patch,chore:patch:Maintenance,docs:patch:Documentation,refactor:patch,perf:patch,style:patch,build:patch,ci:patch,test:patch,feat:minor'
          parse_squash_commits: true
          release_branches: 'main'

      - name: Create Tag for Manual Dispatch
        id: dispatch_tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            RAW="${{ github.event.inputs.custom_version }}"
            VERSION="${RAW#v}"
            TAG="v${VERSION}"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            PREV_VERSION="${PREV_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$PREV_VERSION"
            case "${{ github.event.inputs.release_type }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${VERSION}"
          fi

          echo "Creating and pushing tag $TAG for manual dispatch release..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (Manual Dispatch: ${{ github.event.inputs.release_type }})"
          git push origin "$TAG"

          echo "new_tag=$TAG" >> $GITHUB_OUTPUT
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate SDKs with Fern (Open-Source Local CLI)
        if: steps.breaking_guard.outputs.skip_sdk_build != 'true'
        run: |
          SDK_VERSION="${{ steps.bump_tag.outputs.new_version || steps.dispatch_tag.outputs.new_version }}"
          if [ -z "$SDK_VERSION" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            SDK_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$SDK_VERSION" ]; then
            echo "Generating Fern SDKs for version ${SDK_VERSION}..."
            fern generate --local --version "${SDK_VERSION}"
          else
            echo "Generating Fern SDKs with default versioning..."
            fern generate --local
          fi

      - name: Package SDK Archives
        if: steps.breaking_guard.outputs.skip_sdk_build != 'true'
        run: |
          mkdir -p dist
          tar -czvf dist/astrea-sda-api-sdk-typescript.tar.gz -C sdks/typescript .
          tar -czvf dist/astrea-sda-api-sdk-python.tar.gz -C sdks/python .
          tar -czvf dist/astrea-sda-api-sdk-go.tar.gz -C sdks/go .
          tar -czvf dist/astrea-sda-api-sdk-java.tar.gz -C sdks/java .
          tar -czvf dist/astrea-sda-api-sdk-rust.tar.gz -C sdks/rust .

      - name: Release to GitHub Releases
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bump_tag.outputs.new_tag != '') || (github.event_name == 'workflow_dispatch' && steps.dispatch_tag.outputs.new_tag != '') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_tag.outputs.new_tag || steps.dispatch_tag.outputs.new_tag || github.ref_name }}
          name: ${{ steps.bump_tag.outputs.new_tag || steps.dispatch_tag.outputs.new_tag || github.ref_name }}
          body: ${{ steps.bump_tag.outputs.changelog }}
          files: ${{ steps.breaking_guard.outputs.skip_sdk_build != 'true' && 'dist/astrea-sda-api-sdk-*.tar.gz' || '' }}
          generate_release_notes: true

      - name: Update CHANGELOG.md & Commit
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bump_tag.outputs.new_tag != '') || (github.event_name == 'workflow_dispatch' && steps.dispatch_tag.outputs.new_tag != '')
        run: |
          TAG="${{ steps.bump_tag.outputs.new_tag || steps.dispatch_tag.outputs.new_tag }}"
          CHANGELOG_BODY="${{ steps.bump_tag.outputs.changelog }}"
          RELEASE_DATE=$(date -u +"%Y-%m-%d")

          if [ -z "$CHANGELOG_BODY" ]; then
            CHANGELOG_BODY=$(git log -n 5 --format="* %s (%h)")
          fi

          echo "Updating CHANGELOG.md for $TAG ($RELEASE_DATE)..."
          
          python3 -c "
import os
tag = '''$TAG'''
date = '''$RELEASE_DATE'''
body = '''$CHANGELOG_BODY'''.strip()
content = open('CHANGELOG.md').read() if os.path.exists('CHANGELOG.md') else '# Changelog\n\n## [Unreleased]\n'
entry = f'## [{tag}] - {date}\n\n{body}\n\n'
if '## [Unreleased]' in content:
    idx = content.find('## [Unreleased]') + len('## [Unreleased]')
    new_content = content[:idx] + '\n\n' + entry + content[idx:].lstrip()
else:
    new_content = '# Changelog\n\n' + entry + content
open('CHANGELOG.md', 'w').write(new_content)
"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || (git commit -m "chore(release): update CHANGELOG.md for $TAG [skip ci]" && git push origin HEAD:main)

  deploy-railway:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    needs:
      - test-and-build
      - docker-build-check
      - openapi-breaking-change-check
      - fern-sdk-build-and-release
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Railway Secret Token
        id: check-token
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::notice::RAILWAY_TOKEN secret is not configured in repository secrets. Skipping deployment."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Railway CLI
        if: steps.check-token.outputs.has_token == 'true'
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        if: steps.check-token.outputs.has_token == 'true'
        run: railway up --service astrea-sda-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-github-pages:
    name: Deploy OpenAPI Docs to GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - test-and-build
      - openapi-breaking-change-check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload OAS Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'api-docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


