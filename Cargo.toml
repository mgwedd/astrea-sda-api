[package]
name = "astrea-sda-api"
version = "0.1.0"
edition = "2021"
authors = ["Michael Wedd"]
license = "MIT OR Apache-2.0"
description = "A high-performance Rust API for Space Domain Awareness (SDA), satellite tracking, SGP4 propagation, and visibility prediction"

[dependencies]
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
rayon = "1.8"
sgp4 = "1.0"
libm = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
jsonwebtoken = "9.2"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
dashmap = "=5.5.3"
tokio-util = "0.7"
async-trait = "0.1"


# OpenAPI & Documentation toolchain
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7.0", features = ["axum"] }

# Tiered Cache & Storage dependencies
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.24", features = ["tokio-comp", "aio", "connection-manager", "tokio-native-tls-comp"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
deadpool-redis = "0.14"
postgrest = "1.6"
tiered-cache = "0.1.6"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }

[features]
default = []
postgres = []
